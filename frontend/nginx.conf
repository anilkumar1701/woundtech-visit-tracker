server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API calls to the backend container so the frontend can
    # keep calling same-origin "/api/..." paths (matches the Vite dev
    # proxy) with no CORS handling needed in Docker.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback so client-side routes (if any are added later) don't 404
    # on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
